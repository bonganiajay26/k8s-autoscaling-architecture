name: Validate Kubernetes Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: YAML Syntax Validation
  # ─────────────────────────────────────────────
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 150}}}" \
            $(find . -name "*.yaml" -o -name "*.yml" | grep -v ".github")

  # ─────────────────────────────────────────────
  # JOB 2: Kubernetes Manifest Validation (kubeval)
  # ─────────────────────────────────────────────
  kubeval:
    name: Kubeval — Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          curl -sL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
          sudo mv kubeval /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          kubeval --strict --ignore-missing-schemas \
            namespace.yaml \
            deployment.yaml \
            service.yaml \
            ingress.yaml \
            hpa.yaml \
            vpa.yaml \
            keda-scaledobject.yaml \
            cluster-autoscaler.yaml

  # ─────────────────────────────────────────────
  # JOB 3: Kube-linter Security & Best Practices
  # ─────────────────────────────────────────────
  kube-linter:
    name: Kube-linter — Security & Best Practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: .
          config: .kube-linter.yaml
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 4: Checkov IaC Security Scan
  # ─────────────────────────────────────────────
  checkov:
    name: Checkov — IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: kubernetes
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif
        continue-on-error: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
        if: always()
        continue-on-error: true
