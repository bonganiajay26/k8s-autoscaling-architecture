apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-devops-app-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-devops-app
  minReplicas: 3
  maxReplicas: 50
  metrics:
    # Scale on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # Scale on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    # Scale on custom metric (requests per second via Prometheus Adapter)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100        # double replicas every 60s max
          periodSeconds: 60
        - type: Pods
          value: 5          # or add 5 pods max per 60s
          periodSeconds: 60
      selectPolicy: Max     # use whichever policy adds more pods
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Percent
          value: 25         # remove max 25% of replicas per 60s
          periodSeconds: 60
      selectPolicy: Min     # use the most conservative scale-down
